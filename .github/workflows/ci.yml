name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    server:
        name: Server (lint, integration tests, audit)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: server/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - name: Cache MongoDB binary
              uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-v1
            - run: npm test
            - run: npm audit --omit=dev --audit-level=high

    client:
        name: Client (lint, unit tests, build, audit)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - run: npm run check:classes
            - run: npm run build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
            - name: No server secrets in the browser bundle
              run: |
                  if grep -rEl "ZEGO_SERVER|MEDIA_URL_SECRET|FIREBASE_PRIVATE_KEY|BEGIN PRIVATE KEY" .next/static; then
                    echo "Secret-looking values found in client bundle"; exit 1
                  fi
            - run: npm audit --omit=dev --audit-level=high

    e2e:
        name: End-to-end (Playwright)
        runs-on: ubuntu-latest
        needs: [server, client]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      server/package-lock.json
                      client/package-lock.json
                      e2e/package-lock.json
            - run: npm ci
              working-directory: server
            - run: npm ci
              working-directory: client
            - run: npm ci
              working-directory: e2e
            - run: npx playwright install --with-deps chromium
              working-directory: e2e
            - name: Cache MongoDB binary
              uses: actions/cache@v4
              with:
                  path: ~/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-v1
            - run: npx playwright test
              working-directory: e2e
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-traces
                  path: e2e/test-results
                  retention-days: 7
